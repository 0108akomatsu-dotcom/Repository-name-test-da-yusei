<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#087fe3">
<title>テストだゆうせい</title>
<style>
:root{--blue:#087fe3;--deep:#0756b8;--sky:#e9f8ff;--yellow:#ffcf36;--ink:#123456}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:linear-gradient(160deg,#69d5ff,#eefbff 60%,#a9e9ff);color:var(--ink);display:flex;justify-content:center;padding:14px}
.app{width:min(100%,520px);min-height:calc(100vh - 28px);display:flex;flex-direction:column}
.card{background:#fff;border:4px solid #fff;border-radius:26px;box-shadow:0 8px 0 #1591d9,0 12px 28px #1267a322;padding:20px;margin:auto 0}
.logo{font-size:clamp(2.2rem,10vw,3.6rem);line-height:1.08;font-weight:1000;letter-spacing:.02em;text-align:center;color:#ffb800;text-shadow:3px 4px 0 #ad5a00,-1px -1px #fff,2px 2px 0 #fff}
.logo span{color:#087fe3;text-shadow:3px 4px 0 #064c96,-1px -1px #fff,2px 2px 0 #fff}
.subtitle{text-align:center;font-weight:900;color:var(--deep);margin:12px 0 18px}
.boy{font-size:5rem;text-align:center;filter:drop-shadow(0 4px 0 #b4e9ff);margin:8px}
.intro{text-align:center;font-size:1.05rem;font-weight:750;line-height:1.8}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.primary{display:block;width:100%;border:0;border-radius:999px;padding:16px;background:linear-gradient(#ffe66a,#ffb600);color:#783b00;font-size:1.25rem;font-weight:1000;box-shadow:0 5px 0 #d88700;margin-top:18px}
.primary:active,.choice:active{transform:translateY(2px);box-shadow:0 2px 0 #0a58ad}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--deep);margin-bottom:12px}
.progress{height:10px;border-radius:99px;background:#d9efff;overflow:hidden;margin-bottom:20px}
.progress div{height:100%;background:linear-gradient(90deg,#18c6ff,#087fe3);width:0;transition:width .25s}
.question{font-size:1.35rem;font-weight:950;line-height:1.6;margin:12px 0 20px}
.choices{display:grid;gap:11px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:10px 14px;border:2px solid #69c5ff;border-radius:17px;background:#f0faff;color:#123e6e;font-size:1.08rem;font-weight:850;box-shadow:0 3px 0 #c3eaff}
.letter{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--blue);color:white;font-weight:1000}
.choice:disabled{opacity:1}
.choice.correct{border-color:#23b76c;background:#e5fff0}
.choice.wrong{border-color:#ff7777;background:#fff0f0}
.feedback{min-height:52px;margin-top:14px;font-weight:850;text-align:center;line-height:1.5}
.next{background:var(--blue);color:white;box-shadow:0 4px 0 #064eaa;font-size:1.08rem}
.hidden{display:none!important}
.result-title{text-align:center;font-size:1.9rem;font-weight:1000;color:var(--deep);line-height:1.35}
.result-img{width:100%;max-height:52vh;object-fit:contain;display:block;border-radius:16px;margin:14px auto 4px}
.score{font-size:1.25rem;text-align:center;font-weight:950;margin:10px}
.small{text-align:center;font-size:.85rem;color:#47718f;margin-top:16px}
@media(max-height:700px){.card{padding:15px}.question{margin:8px 0 12px}.choice{min-height:49px}.result-img{max-height:40vh}}
</style>
</head>
<body>
<main class="app">
<section id="start" class="card">
  <div class="logo">テストだ<br><span>ゆうせい</span></div>
  <div class="subtitle">小学3年生レベル・社会クイズ 全5問</div>
  <div class="boy" aria-hidden="true">🧒🏻 ✏️</div>
  <p class="intro">しゃかいの もんだいに<br>4つの こたえから ちょうせん！<br>3問以上 正解すると ごほうびだよ。</p>
  <button id="startBtn" class="primary">▶ スタート！</button>
  <div class="small">音が出るよ。音量に気をつけてね。</div>
</section>
<section id="quiz" class="card hidden">
  <div class="top"><span id="qcount">第1問 / 全5問</span><span id="scoreLive">正解 0</span></div>
  <div class="progress"><div id="bar"></div></div>
  <div id="question" class="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <button id="nextBtn" class="primary next hidden">つぎの問題へ →</button>
</section>
<section id="result" class="card hidden">
  <div id="resultTitle" class="result-title"></div>
  <div id="resultScore" class="score"></div>
  <img id="resultImg" class="result-img" alt="">
  <p id="resultText" class="intro"></p>
  <button id="againBtn" class="primary">↻ もういちど あそぶ</button>
</section>
</main>
<script>
const questions = [
 {q:"日本のまわりにある海はどれ？", choices:["日本海","地中海","カリブ海","黒海"],a:0,why:"日本の西側には日本海が広がっているよ。"},
 {q:"北海道で、広い土地を使って多く作られている作物はどれ？",choices:["さとうきび","小麦","オリーブ","パイナップル"],a:1,why:"北海道では小麦やじゃがいもなど、広い土地を使った農業がさかんだよ。"},
 {q:"地図で、土地の高さや山の形を表すのに使うものはどれ？",choices:["天気記号","交通標識","等高線","郵便番号"],a:2,why:"等高線は、同じ高さの場所を結んだ線だよ。"},
 {q:"野菜や米を育てる仕事を何という？",choices:["漁業","林業","工業","農業"],a:3,why:"田や畑で作物を育てる仕事は農業だよ。"},
 {q:"消防しょの人たちが、主に行う仕事はどれ？",choices:["火事を消し、人を助ける","道路を作る","郵便を配る","電車を運転する"],a:0,why:"消防しょは火事を消したり、救急などで人の命を守ったりするよ。"}
];
let index=0, score=0, locked=false, audioCtx=null;
const $=id=>document.getElementById(id);
function beep(ok){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type="sine";
  if(ok){osc.frequency.setValueAtTime(660,now);osc.frequency.setValueAtTime(880,now+.11);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.18,now+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+.28);osc.start(now);osc.stop(now+.3);}
  else{osc.frequency.setValueAtTime(220,now);osc.frequency.setValueAtTime(165,now+.13);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.14,now+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+.32);osc.start(now);osc.stop(now+.34);}
 }catch(e){}
}
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function start(){index=0;score=0;locked=false;show("quiz");render()}
function render(){
 locked=false;const item=questions[index];
 $("qcount").textContent=`第${index+1}問 / 全${questions.length}問`;
 $("scoreLive").textContent=`正解 ${score}`;
 $("bar").style.width=`${index/questions.length*100}%`;
 $("question").textContent=item.q;$("feedback").textContent="";$("nextBtn").classList.add("hidden");
 const list=$("choices");list.innerHTML="";
 item.choices.forEach((label,i)=>{
  const b=document.createElement("button");b.className="choice";
  const letter=document.createElement("span");letter.className="letter";letter.textContent=["A","B","C","D"][i];
  const txt=document.createElement("span");txt.textContent=label;b.append(letter,txt);
  b.addEventListener("click",()=>answer(i,b));list.appendChild(b);
 });
}
function answer(selected,button){
 if(locked)return;locked=true;const item=questions[index];const buttons=[...$("choices").children];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add("correct");});
 if(selected===item.a){score++;beep(true);$("feedback").textContent="ピンポン！ 正解！ "+item.why;}
 else{button.classList.add("wrong");beep(false);$("feedback").textContent="ざんねん！ 正解は「"+item.choices[item.a]+"」。"+item.why;}
 $("scoreLive").textContent=`正解 ${score}`;$("bar").style.width=`${(index+1)/questions.length*100}%`;
 $("nextBtn").textContent=index===questions.length-1?"結果を見る →":"つぎの問題へ →";
 $("nextBtn").classList.remove("hidden");
}
function finish(){
 show("result");const win=score>=3;
 $("resultTitle").textContent=win?"🎉 3問以上 正解！":"もうすこし がんばろう！";
 $("resultScore").textContent=`5問中 ${score}問 正解`;
 $("resultImg").src=win?SUCCESS_IMAGE:FAILURE_IMAGE;
 $("resultImg").alt=win?"よろこぶ男の子とパズルのイラスト":"川にテスト用紙を投げる男の子のイラスト";
 $("resultText").textContent=win?"すごい！ よくがんばったね！":"テスト用紙は川に投げないでね。もう一度チャレンジしよう！";
}
